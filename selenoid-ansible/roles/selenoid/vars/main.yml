---
# Docker Hub credentials (commented out, not used)
#docker_hub_username: "{{ lookup('env', 'DOCKER_HUB_USERNAME') | default('', true) }}"
#docker_hub_password: "{{ lookup('env', 'DOCKER_HUB_PASSWORD') | default('', true) }}"

# Selenoid Configuration
selenoid_version: "1.11.2"
selenoid_ui_version: "1.10.10"
video_recorder_version: "latest-release"

# Browser Versions
chrome_version: "120.0"
firefox_version: "121.0"
opera_version: "106.0"

# Image Tags
chrome_image: "selenoid/vnc:chrome_{{ chrome_version }}"
firefox_image: "selenoid/vnc:firefox_{{ firefox_version }}"
opera_image: "selenoid/vnc:opera_{{ opera_version }}"

# Ports for first Selenoid and UI
selenoid1_port: 4445                # был selenoid_port
selenoid_ui_port: 8080

# Ports for second Selenoid
selenoid2_port: 4446

# GGR and GGR UI
ggr_version: "latest-release"
ggr_ui_version: "latest-release"
ggr_port: 4444
ggr_ui_port: 8081

# Directories for first Selenoid (остаются без изменений)
selenoid_base_dir: "/opt/selenoid"
selenoid_config_dir: "{{ selenoid_base_dir }}/config"
selenoid_video_dir: "{{ selenoid_base_dir }}/video"
selenoid_logs_dir: "{{ selenoid_base_dir }}/logs"
selenoid_download_dir: "{{ selenoid_base_dir }}/download"

# Directories for second Selenoid
selenoid2_base_dir: "/opt/selenoid2"
selenoid2_config_dir: "{{ selenoid2_base_dir }}/config"
selenoid2_video_dir: "{{ selenoid2_base_dir }}/video"
selenoid2_logs_dir: "{{ selenoid2_base_dir }}/logs"
selenoid2_download_dir: "{{ selenoid2_base_dir }}/download"

# GGR directories
ggr_config_dir: "/opt/ggr/config"

# Docker settings
docker_network_name: "selenoid_network"
docker_compose_file: "{{ selenoid_base_dir }}/docker-compose.yml"

# Jenkins configuration
jenkins_image: "jenkins/jenkins:lts-jdk17"
jenkins_port: 8090
jenkins_agent_port: 50001
jenkins_home: "/opt/jenkins_home"
jenkins_backup_dir: "/opt/jenkins_backup"
jenkins_install_plugins: true
jenkins_create_test_job: true