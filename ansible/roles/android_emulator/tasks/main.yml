---
- name: Install ADB tools on host for debugging
  apt:
    name:
      - adb
      - android-tools-adb
    state: present
    update_cache: yes
  when:
    - android_enabled
    - ansible_os_family == "Debian"
  tags: android

- name: Create Android Emulator directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"
  loop:
    - "{{ android_base_dir }}"
    - "{{ android_apps_dir }}"
    - "{{ android_results_dir }}"
    - "{{ android_config_dir }}"
    - "{{ android_avd_dir }}"
    - "{{ android_logs_dir }}"
  when: android_enabled

- name: Check if test app exists on server
  stat:
    path: "{{ test_app_destination }}"
  register: app_file
  when: android_enabled

- name: Copy test app to server
  copy:
    src: "{{ test_app_source }}"
    dest: "{{ test_app_destination }}"
    mode: "0644"
    owner: "1000"
    group: "1000"
  when:
    - android_enabled
    - not app_file.stat.exists

- name: Ensure KVM permissions
  file:
    path: /dev/kvm
    mode: "0666"
  when: android_enabled

- name: Check if Docker image exists locally
  shell: "docker images -q {{ android_emulator_image }}:{{ android_emulator_tag }} 2>/dev/null"
  register: android_image_exists
  changed_when: false
  when: android_enabled

- name: Pull Android emulator Docker image (redroid)
  docker_image:
    name: "{{ android_emulator_image }}"
    tag: "{{ android_emulator_tag }}"
    source: pull
  when:
    - android_enabled
    - android_image_exists.stdout == ""
  register: pull_android_image
  retries: 3
  delay: 10
  until: pull_android_image is succeeded

- name: Pull Appium Docker image
  docker_image:
    name: "appium/appium"
    tag: "latest"
    source: pull
  when: android_enabled

- name: Create docker-compose file for Android emulator
  template:
    src: docker-compose-android.yml.j2
    dest: "{{ android_base_dir }}/docker-compose.yml"
    mode: "0644"
  when: android_enabled

- name: Stop existing Android emulator containers
  shell: |
    cd {{ android_base_dir }} && docker compose down -v 2>/dev/null || docker-compose down -v 2>/dev/null || true
  ignore_errors: yes
  when: android_enabled
  changed_when: false

- name: Start Android emulator stack
  shell: |
    cd {{ android_base_dir }} && docker compose up -d
  register: android_compose_result
  when: android_enabled

- name: Wait for Android emulator to initialize
  pause:
    seconds: 60
  when: android_enabled

- name: Check if Android emulator is running
  shell: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' android-emulator 2>/dev/null || echo 'false'"
  register: android_running
  changed_when: false
  when: android_enabled

- name: Check and fix ADB connection
  block:
    - name: Wait for ADB connection from Appium container
      shell: |
        docker exec appium-server adb connect android-emulator:5555
      register: adb_first_connect
      retries: 5
      delay: 10
      until: adb_first_connect is succeeded or ('connected' in adb_first_connect.stdout or 'already connected' in adb_first_connect.stdout)

    - name: Verify device status
      shell: |
        docker exec appium-server adb devices | grep android-emulator:5555
      register: device_status
      retries: 10
      delay: 5
      until: device_status is succeeded and 'device' in device_status.stdout

    - name: Show ADB status
      debug:
        msg: "✅ ADB connected: {{ device_status.stdout }}"

  when: android_enabled
  rescue:
    - name: Show ADB debug info if connection fails
      shell: |
        echo "=== ADB Debug Info ==="
        docker exec appium-server adb devices
        docker exec appium-server ping -c 2 android-emulator || echo "Ping failed"
        docker inspect android-emulator | grep -A 5 "Networks"
      register: adb_debug
      ignore_errors: yes

    - debug:
        var: adb_debug.stdout_lines

- name: Wait for emulator to be fully ready and install app
  block:
    - name: Wait for ADB port to be open on host
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 5555
        delay: 5
        timeout: 180
      register: port_check

    - name: Connect ADB to emulator from host
      shell: |
        adb connect {{ inventory_hostname }}:5555
        sleep 3
      when: port_check is success
      register: adb_connect

    - name: Check ADB from Appium container again
      shell: |
        docker exec appium-server adb devices
      register: container_adb
      when: adb_connect is success

    - name: Fix ADB if needed in container
      shell: |
        docker exec appium-server adb disconnect android-emulator:5555
        docker exec appium-server adb connect android-emulator:5555
        sleep 3
      when:
        - container_adb is defined
        - container_adb.stdout is not search('device')
      register: adb_fix

    - name: Wait for device to be fully booted
      shell: |
        adb -s {{ inventory_hostname }}:5555 wait-for-device
        adb -s {{ inventory_hostname }}:5555 shell 'while [[ -z $(getprop sys.boot_completed) ]]; do echo "Waiting for boot..." && sleep 5; done;'
      register: boot_wait
      retries: 30
      delay: 10
      until: boot_wait is succeeded
      when: adb_connect is success

    - name: Disable animations (for faster tests)
      shell: |
        adb -s {{ inventory_hostname }}:5555 shell settings put global window_animation_scale 0
        adb -s {{ inventory_hostname }}:5555 shell settings put global transition_animation_scale 0
        adb -s {{ inventory_hostname }}:5555 shell settings put global animator_duration_scale 0
      when: boot_wait is succeeded
      ignore_errors: yes

    - name: Install test app on emulator
      shell: |
        adb -s {{ inventory_hostname }}:5555 install -r {{ test_app_destination }}
      register: app_install
      retries: 3
      delay: 10
      until: app_install is succeeded
      when: boot_wait is succeeded

    - name: Verify Appium server is running
      uri:
        url: "http://{{ inventory_hostname }}:{{ appium_port }}/status"
        method: GET
        status_code: 200
        timeout: 30
      register: appium_status
      retries: 15
      delay: 5
      until: appium_status is succeeded
      when: boot_wait is succeeded

  when:
    - android_enabled
    - android_running.stdout | trim == "true"
  rescue:
    - name: Show emulator logs if ready check fails
      shell: docker logs android-emulator --tail 50
      register: emulator_logs
      ignore_errors: yes

    - debug:
        msg: "Failed to wait for emulator. Logs: {{ emulator_logs.stdout if emulator_logs is defined else 'No logs' }}"

- name: Display Android emulator info
  debug:
    msg:
      - "✅ Android Emulator deployment completed!"
      - "   Emulator: Android {{ android_platform_version }} (API {{ android_api_level }})"
      - "   Device: {{ android_device }}"
      - "   ADB connection: adb connect {{ inventory_hostname }}:5555"
      - "   ADB in container: docker exec appium-server adb connect android-emulator:5555"
      - "   Appium server: http://{{ inventory_hostname }}:{{ appium_port }}"
      - "   Test app: {{ test_app_name }}"
      - "   Container status: {{ 'Running' if android_running.stdout | trim == 'true' else 'Not running' }}"
      - ""
      - "   📱 Commands to test:"
      - "      adb connect {{ inventory_hostname }}:5555"
      - "      adb shell"
      - "      curl http://{{ inventory_hostname }}:{{ appium_port }}/status"
      - "      docker exec appium-server adb devices"
      - "      docker logs android-emulator"