- name: Remove any conflicting containers from previous manual runs
  shell: docker rm -f ggr ggr-ui selenoid-1 selenoid-2 selenoid-ui 2>/dev/null || true
  changed_when: false
  tags: cleanup

- name: Pull GGR image
  command: docker pull aerokube/ggr:{{ ggr_version }}
  register: pull_ggr
  retries: 3
  delay: 5
  until: pull_ggr is succeeded
  changed_when: false
  ignore_errors: yes

- name: Pull GGR UI image
  command: docker pull aerokube/ggr-ui:{{ ggr_ui_version }}
  register: pull_ggr_ui
  retries: 3
  delay: 5
  until: pull_ggr_ui is succeeded
  changed_when: false
  ignore_errors: yes

- name: Stop existing containers (if any)
  command: docker compose down
  args:
    chdir: "{{ selenoid_base_dir }}"
  ignore_errors: yes
  tags: restart

- name: Pull images explicitly
  command: docker compose pull
  args:
    chdir: "{{ selenoid_base_dir }}"
  register: pull_result
  retries: 3
  delay: 5
  until: pull_result is succeeded
  tags: restart

- name: Start Selenoid stack
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ selenoid_base_dir }}"
  register: compose_result
  tags: restart

- name: Wait for containers to start
  pause:
    seconds: 20
  tags: restart

- name: Get GGR container logs
  shell: "docker logs ggr 2>&1 | tail -50"
  register: ggr_logs
  ignore_errors: yes
  changed_when: false
  tags: debug

- name: Display GGR logs
  debug:
    var: ggr_logs.stdout_lines
  when: ggr_logs.stdout_lines | length > 0
  tags: debug

- name: Get GGR UI container logs
  shell: "docker logs ggr-ui 2>&1 | tail -50"
  register: ggr_ui_logs
  ignore_errors: yes
  changed_when: false
  tags: debug

- name: Display GGR UI logs
  debug:
    var: ggr_ui_logs.stdout_lines
  when: ggr_ui_logs.stdout_lines | length > 0
  tags: debug

- name: Get first Selenoid container logs
  shell: "docker logs selenoid-1 2>&1 | tail -50"
  register: selenoid1_logs
  ignore_errors: yes
  changed_when: false
  tags: debug

- name: Display first Selenoid logs
  debug:
    var: selenoid1_logs.stdout_lines
  when: selenoid1_logs.stdout_lines | length > 0
  tags: debug

- name: Check if first Selenoid container is running
  shell: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' selenoid-1 2>/dev/null || echo 'false'"
  register: selenoid1_running
  changed_when: false

- name: Fail if first Selenoid container is not running
  fail:
    msg: "First Selenoid container (selenoid-1) failed to start! Check logs above."
  when: selenoid1_running.stdout | trim != "true"

- name: Check if second Selenoid container is running
  shell: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' selenoid-2 2>/dev/null || echo 'false'"
  register: selenoid2_running
  changed_when: false

- name: Fail if second Selenoid container is not running
  fail:
    msg: "Second Selenoid container (selenoid-2) failed to start!"
  when: selenoid2_running.stdout | trim != "true"

- name: Check if GGR container is running
  shell: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' ggr 2>/dev/null || echo 'false'"
  register: ggr_running
  changed_when: false

- name: Fail if GGR container is not running
  fail:
    msg: "GGR container failed to start!"
  when: ggr_running.stdout | trim != "true"

- name: Wait for GGR API to be ready
  wait_for:
    host: "localhost"
    port: "{{ ggr_port }}"
    delay: 5
    timeout: 120
  when: ggr_running.stdout | trim == "true"

- name: Verify containers status
  shell: "docker ps --filter name=selenoid-1 --filter name=selenoid-2 --filter name=ggr --filter name=ggr-ui --format 'table {{ '{{' }}.Names{{ '}}' }}\\t{{ '{{' }}.Status{{ '}}' }}'"
  register: containers_status
  changed_when: false

- name: Display deployment summary
  debug:
    msg:
      - "✅ Selenoid + GGR deployment completed!"
      - "   GGR (load balancer): http://{{ inventory_hostname }}:{{ ggr_port }}/wd/hub"
      - "   First Selenoid direct: http://{{ inventory_hostname }}:{{ selenoid1_port }}/wd/hub"
      - "   Second Selenoid direct: http://{{ inventory_hostname }}:{{ selenoid2_port }}/wd/hub"
      - "   Selenoid UI:  http://{{ inventory_hostname }}:{{ selenoid_ui_port }}"
      - "   GGR UI:       http://{{ inventory_hostname }}:{{ ggr_ui_port }}"
      - "   Containers:"
      - "{{ containers_status.stdout | indent(4) }}"