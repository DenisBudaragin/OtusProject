---
- name: Ensure Docker network exists
  docker_network:
    name: "{{ docker_network_name }}"
    state: present
    driver: bridge
  when: ansible_os_family == "Debian"
  tags: network

- name: Create Selenoid directories (first instance)
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ selenoid_base_dir }}"
    - "{{ selenoid_config_dir }}"
    - "{{ selenoid_video_dir }}"
    - "{{ selenoid_logs_dir }}"
    - "{{ selenoid_download_dir }}"

- name: Create directories for second Selenoid instance
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ selenoid2_base_dir }}"
    - "{{ selenoid2_config_dir }}"
    - "{{ selenoid2_video_dir }}"
    - "{{ selenoid2_logs_dir }}"
    - "{{ selenoid2_download_dir }}"

- name: Create directory for GGR config
  file:
    path: "{{ ggr_config_dir }}"
    state: directory
    mode: "0755"

- name: Remove users.htpasswd to allow guest access
  file:
    path: "{{ ggr_config_dir }}/users.htpasswd"
    state: absent
  tags: ggr_config

- name: Create quota directory for GGR
  file:
    path: "{{ ggr_config_dir }}/quota"
    state: directory
    mode: "0755"

- name: Create default quota file with browser configurations
  template:
    src: quota.xml.j2
    dest: "{{ ggr_config_dir }}/quota/default.xml"
    mode: "0644"
  tags: ggr_config

- name: Create docker-compose.yml from template
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_file }}"
    mode: "0644"

- name: Create browsers.json from template (shared for both instances)
  template:
    src: browsers.json.j2
    dest: "{{ selenoid_config_dir }}/browsers.json"
    mode: "0644"

- name: Copy browsers.json to second instance config directory
  copy:
    src: "{{ selenoid_config_dir }}/browsers.json"
    dest: "{{ selenoid2_config_dir }}/browsers.json"
    remote_src: yes
    mode: "0644"

- name: Create GGR config from template
  template:
    src: ggr.conf.j2
    dest: "{{ ggr_config_dir }}/ggr.conf"
    mode: "0644"

- name: Pull Chrome browser image
  command: docker pull "{{ chrome_image }}"
  register: pull_chrome
  retries: 3
  delay: 5
  until: pull_chrome is succeeded
  changed_when: false
  tags: pull_browsers

