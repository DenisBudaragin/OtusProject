---
- name: Manage Selenoid and Selenoid UI containers
  hosts: all
  become: yes
  vars_files:
    - main.yml

  vars:
    selenoid_config_dir: /etc/selenoid
    browsers_config_file: "{{ selenoid_config_dir }}/browsers.json"
    selenoid_network: selenoid_network

  tasks:
    # 1. Проверка, что Docker установлен и работает
    - name: Check if Docker is installed and running
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false
      tags: setup

    - name: Fail if Docker is not installed
      fail:
        msg: "Docker is not installed. Please install Docker first."
      when: docker_check.rc != 0
      tags: setup

    - name: Check Docker daemon status
      systemd:
        name: docker
        state: started
        enabled: yes
      tags: setup

    # 2. Показать все запущенные контейнеры Docker (новая задача)
    - name: Show all running Docker containers
      command: docker ps
      register: docker_ps_result
      changed_when: false
      tags: docker-info

    - name: Display running Docker containers
      debug:
        msg: "{{ docker_ps_result.stdout_lines }}"
      tags: docker-info

    # 3. Проверка существования контейнеров и их состояния
    - name: Check Selenoid container status
      docker_container_info:
        name: selenoid
      register: selenoid_info
      ignore_errors: yes
      changed_when: false
      tags: check-status

    - name: Check Selenoid UI container status
      docker_container_info:
        name: selenoid-ui
      register: selenoid_ui_info
      ignore_errors: yes
      changed_when: false
      tags: check-status

    # 4. Создание Docker сети для Selenoid (если нет)
    - name: Create Docker network for Selenoid
      docker_network:
        name: "{{ selenoid_network }}"
        driver: bridge
        state: present
      tags: network

    # 5. Создание директорий для данных (если нет)
    - name: Create directories for Selenoid data
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - "{{ selenoid_config_dir }}"
        - "/opt/selenoid/video"
        - "/opt/selenoid/logs"
        - "/opt/selenoid/data"
      when: not selenoid_info.exists or not selenoid_ui_info.exists
      tags: config

    # 6. Конфигурация браузеров (только если нет файла или контейнеров)
    - name: Check if browsers config exists
      stat:
        path: "{{ browsers_config_file }}"
      register: browsers_config_stat
      tags: config

    - name: Deploy browsers configuration
      copy:
        dest: "{{ browsers_config_file }}"
        content: |
          {
            "chrome": {
              "default": "122",
              "versions": {
                "122": {
                  "image": "selenoid/chrome:122.0",
                  "port": "4444",
                  "path": "/"
                }
              }
            },
            "firefox": {
              "default": "120",
              "versions": {
                "120": {
                  "image": "selenoid/firefox:120.0",
                  "port": "4444",
                  "path": "/wd/hub"
                }
              }
            }
          }
        mode: '0644'
      when: not browsers_config_stat.stat.exists or not selenoid_info.exists
      notify: Restart selenoid
      tags: config

    # 7. Запуск Selenoid (только если не запущен)
    - name: Start Selenoid container if not running
      docker_container:
        name: selenoid
        image: "aerokube/selenoid:{{ selenoid_version }}"
        state: started
        restart_policy: always
        network_mode: bridge
        ports:
          - "{{ selenoid_port }}:4444"
          - "{{ selenoid_host }}:{{ selenoid_port }}:4444"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ selenoid_config_dir }}:/etc/selenoid"
          - "/opt/selenoid/video:/opt/selenoid/video"
          - "/opt/selenoid/logs:/opt/selenoid/logs"
        env:
          OVERRIDE_VIDEO_OUTPUT_DIR: "/opt/selenoid/video"
          TZ: "UTC"
          SERVICE_NAME: "selenoid"
          SERVICE_IGNORE: "1"
        command:
          - "-limit"
          - "20"
          - "-timeout"
          - "5m"
          - "-session-attempt-timeout"
          - "2m"
          - "-service-startup-timeout"
          - "2m"
          - "-conf"
          - "/etc/selenoid/browsers.json"
          - "-container-network"
          - "{{ selenoid_network }}"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"
      when: not selenoid_info.exists or selenoid_info.container.State.Status != "running"
      register: selenoid_container
      tags: selenoid

    # 8. Запуск Selenoid UI (только если не запущен)
    - name: Start Selenoid UI container if not running
      docker_container:
        name: selenoid-ui
        image: "aerokube/selenoid-ui:{{ selenoid_ui_version }}"
        state: started
        restart_policy: always
        network_mode: bridge
        ports:
          - "{{ selenoid_ui_port }}:8080"
          - "{{ selenoid_host }}:{{ selenoid_ui_port }}:8080"
        env:
          SELENOID_URL: "http://{{ selenoid_host }}:{{ selenoid_port }}"
          TZ: "UTC"
          SERVICE_NAME: "selenoid-ui"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"
      when: not selenoid_ui_info.exists or selenoid_ui_info.container.State.Status != "running"
      register: selenoid_ui_container
      tags: selenoid-ui

    # 9. Проверка работоспособности (всегда)
    - name: Check Selenoid health
      uri:
        url: "http://{{ selenoid_host }}:{{ selenoid_port }}/status"
        method: GET
        status_code: 200
        timeout: 30
        validate_certs: no
      register: selenoid_health
      retries: 5
      delay: 10
      until: selenoid_health.status == 200
      tags: health-check

    - name: Check Selenoid UI health
      uri:
        url: "http://{{ selenoid_host }}:{{ selenoid_ui_port }}/"
        method: GET
        status_code: 200
        timeout: 30
        validate_certs: no
      register: selenoid_ui_health
      retries: 5
      delay: 10
      until: selenoid_ui_health.status == 200
      tags: health-check

    # 10. Показать все контейнеры Docker после выполнения (новая задача)
    - name: Show all Docker containers after execution
      command: docker ps -a
      register: docker_ps_all_result
      changed_when: false
      tags: docker-info-final

    - name: Display all Docker containers after execution
      debug:
        msg: "{{ docker_ps_all_result.stdout_lines }}"
      tags: docker-info-final

    # 11. Отображение информации о доступности
    - name: Display connection information
      debug:
        msg:
          - "Selenoid доступен по адресу: http://{{ selenoid_host }}:{{ selenoid_port }}/status"
          - "Selenoid UI доступен по адресу: http://{{ selenoid_host }}:{{ selenoid_ui_port }}/"
          - "Selenoid статус: {{ 'RUNNING' if selenoid_health.status == 200 else 'ERROR' }}"
          - "Selenoid UI статус: {{ 'RUNNING' if selenoid_ui_health.status == 200 else 'ERROR' }}"
          - "Для WebDriver используйте: http://{{ selenoid_host }}:{{ selenoid_port }}/wd/hub"
          - "Контейнер Selenoid: {{ 'уже запущен' if selenoid_info.exists and selenoid_info.container.State.Status == 'running' else 'был запущен' }}"
          - "Контейнер Selenoid UI: {{ 'уже запущен' if selenoid_ui_info.exists and selenoid_ui_info.container.State.Status == 'running' else 'был запущен' }}"
      tags: info

  handlers:
    - name: Restart selenoid
      docker_container:
        name: selenoid
        state: started
        restart: yes